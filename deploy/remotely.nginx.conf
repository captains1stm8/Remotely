# /etc/nginx/sites-available/remotely  — replace remotely.example.com with the VPS domain.
# Proxies to the container on 127.0.0.1:5000 (container runs with --network host).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name remotely.example.com;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;   # SignalR hubs: /BrowserHub /DeviceHub /RCBrowserHub /RCDeviceHub
    }
}
